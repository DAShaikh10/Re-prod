  { type = "file", path = "{{output}}", record_as = "artifact" }
]
template = """library(ggplot2)
p <- ggplot({{data}}, aes(x = {{x}})) +
  geom_histogram(bins = {{bins}}) +
  theme_minimal()
ggsave("{{output}}", plot = p, width = {{width}}/100, height = {{height}}/100, dpi = 100)"""
