id = "ggplot2"
display_name = "ggplot2: Grammar of Graphics"
kind = "r-package"
description = "Declarative system for creating elegant data visualizations based on the grammar of graphics."
version = "3.5.0"
homepage = "https://ggplot2.tidyverse.org/"
tags = ["visualization", "plotting", "tidyverse", "graphics"]

[runtime]
r_library = "ggplot2"
imports = ["ggplot2"]
cli_binary = ""
args = []

[validation]
requires_packages = ["ggplot2"]
requires_cli = []
preflight_r = "if (!requireNamespace('ggplot2', quietly = TRUE)) stop('ggplot2 package is not installed')"
preflight_cli = ""

[[capabilities]]
id = "ggplot2::scatter_plot"
display_name = "Create scatter plot"
kind = "r-snippet"
entrypoint = "ggplot2::ggplot"
description = "Generate a scatter plot with customizable aesthetics and save to PNG."
input_spec = [
  { name = "data", type = "string", format = "r-object" },
  { name = "x", type = "string", format = "column-name" },
  { name = "y", type = "string", format = "column-name" },
  { name = "output", type = "file", format = "png", role = "generated" },
  { name = "width", type = "integer", default = 800 },
  { name = "height", type = "integer", default = 600 }
]
output_spec = [
  { type = "file", path = "{{output}}", record_as = "artifact" }
]
template = """library(ggplot2)
p <- ggplot({{data}}, aes(x = {{x}}, y = {{y}})) +
  geom_point() +
  theme_minimal()
ggsave("{{output}}", plot = p, width = {{width}}/100, height = {{height}}/100, dpi = 100)"""
post_validation = "if (!file.exists('{{output}}')) stop('Plot file not generated')"

