name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm -r lint
      - run: cargo check --workspace
